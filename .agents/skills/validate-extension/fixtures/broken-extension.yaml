# Do NOT "fix" the violations here — the fixture's job is to be broken.
apiVersion: v1
kind: ConfigMap
metadata:
  name: broken-pizza-ui
  namespace: kube-public
  labels:
    busola.io/extension: resource
    # (seeded) the required version label is intentionally omitted here
data:
  general: |-
    resource:
      kind: Pizza
      version: v1alpha1
      group: busola.example.com
    name: Pizzas
    category: Lunch
    scope: worldwide
  # (seeded) customScript is a SIBLING of general (data.customScript), and here
