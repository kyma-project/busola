name: PR Integration Cluster Tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pull-integration-cluster-k3d.yml'
      - '.github/scripts/**'
      - 'backend/**'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'Makefile'
      - 'Dockerfile*'
      - 'nginx/**'
      - 'resources/**'
      - 'tests/integration/**'
  merge_group:
  workflow_call:
    inputs:
      trigger_env:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      loop_probe:
        description: 'Enable the edit-cluster OOM loop diagnostic probe (CDP profiling + in-page probe + Chrome memory sampler). Leave off for normal runs.'
        type: boolean
        default: false

concurrency:
  group: pull-integration-cluster-k3d-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-cluster-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.pull_request.draft == false
    steps:
      - uses: gardenlinux/workflow-telemetry-action@v2
        with:
          comment_on_pr: false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge with latest main
        if: inputs.trigger_env != 'release-trigger'
        uses: ./.github/actions/merge
      - name: Create Single Cluster
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79 #v2.4.0
        with:
          cluster-name: 'k3dCluster'
          k3d-version: v5.8.3
          args: >-
            --agents 1
            --port 80:80@loadbalancer
            --port 443:443@loadbalancer
            --wait
      - uses: actions/setup-node@v7
        name: Setup node
        with:
          node-version: 24
      - name: Setup Busola
        shell: bash
        run: |
          .github/scripts/setup_local_busola.sh | tee busola.log
      - name: Install custom component example
        shell: bash
        run: |
          kubectl create namespace kyma-system
          (cd examples/busola-web-components && kubectl kustomize . | kubectl apply -n kyma-system -f - )
      - name: Install sap-logging extensibility example
        shell: bash
        run: |
          kubectl create namespace sap-cloud-logging-integration
          kubectl apply -f tests/integration/fixtures/sap-logging-secret.yaml
          kubectl apply -f tests/integration/fixtures/sap-loggging-config-map.yaml
      - name: Run tests
        shell: bash
        env:
          # only set when the diagnostic build is triggered via workflow_dispatch;
          # empty (probe off) for all normal pull_request / merge_group runs
          LOOP_PROBE: ${{ inputs.loop_probe && '1' || '' }}
        run: |
          k3d kubeconfig get k3dCluster > tests/integration/fixtures/kubeconfig.yaml
          export CYPRESS_DOMAIN=http://localhost:3001
          cd tests/integration
          npm ci
          SAMPLER_PID=""
          if [ -n "$LOOP_PROBE" ]; then
            echo "loop-probe ENABLED: starting Chrome memory sampler + CYPRESS_LOOP_PROBE"
            mkdir -p cypress/loop-probe
            export CYPRESS_LOOP_PROBE=1
            bash ../../.github/scripts/sample-chrome-mem.sh cypress/loop-probe/chrome-mem.csv 1 &
            SAMPLER_PID=$!
          fi
          set +e
          npm run "test:cluster"
          rc=$?
          set -e
          if [ -n "$SAMPLER_PID" ]; then kill "$SAMPLER_PID" 2>/dev/null || true; fi
          exit $rc
      - name: Uploads artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: cypress-${{ github.job }}
          path: tests/integration/cypress/
          retention-days: 30
      - name: Upload Busola logs
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: busola-logs-${{ github.job }}
          path: |
            busola.log
          retention-days: 30
