name: PR Kyma Dashboard K8s Chart test

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pull-kyma-intergation-tests.yml'
      - '.github/scripts/**'
      - 'kyma/**'
      - 'backend/**'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'Makefile'
      - 'Dockerfile*'
      - 'nginx/**'
      - 'resources/**'
      - 'tests/integration/**'
  workflow_call:
    inputs:
      trigger_env:
        type: string
        required: false

concurrency:
  group: pull-k8s-chart-smoke-tests-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-k8s-test:
    runs-on: ubuntu-latest
    env:
      IMG: kyma-dashboard:local-pr-${{github.sha}}
    if: github.event.pull_request.draft == false
    steps:
      - uses: gardenlinux/workflow-telemetry-action@9742ad16c70308bc8fa5f850d6ee6b22f2cce076 # v2
        with:
          comment_on_pr: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Merge with latest main
        if: inputs.trigger_env != 'release-trigger'
        uses: ./.github/actions/merge
      - name: Install k3d
        shell: bash
        env:
          K3D_URL: https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh
        run: curl --silent --fail $K3D_URL | bash
      - name: Setup K3d cluster
        shell: bash
        run: |
          ./.github/scripts/provision_k3d_for_kyma.sh | tee kyma-provision.log
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Setup node
        with:
          node-version: 26
      - name: Build Busola Docker Image
        shell: bash
        run: docker build -t "${IMG}" -f Dockerfile . | tee busola-build.log
      - name: Import Kyma Dashbaord image to k3d
        shell: bash
        run: k3d image import "${IMG}" -c kyma
      - name: Deploy Busola
        id: deploy_busola
        shell: bash
        run: .github/scripts/deploy_busola_on_k8s.sh "${IMG}" | tee busola-deploy.log
        env:
          ENV: stage
      - name: Prepare kubeconfig
        shell: bash
        run: |
          .github/scripts/prepare_kubeconfig.sh
      - name: Run tests
        shell: bash
        run: |
          export CYPRESS_DOMAIN=http://${{ steps.deploy_busola.outputs.IP }}
          cd tests/integration
          npm ci && npm run "test:smoke-simple"
      - name: Uploads artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: cypress-${{ github.job }}
          path: tests/integration/cypress
          retention-days: 30
      - name: Upload Kyma Dashboard logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: kyma-dashboard-logs-${{ github.job }}
          path: |
            kyma-alpha-deploy.log
            kyma-provision.log
            busola-build.log
          retention-days: 30
